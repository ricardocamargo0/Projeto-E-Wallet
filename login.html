<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Bug corrigido: charset era UTF-3, deve ser UTF-8 -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Wallet — Login</title>
    <link rel="stylesheet" href="css/estilo-login.css">
</head>
<body>
    <header>
        <div class="logo">
            <img class="imglogo" src="./img/logo.png" alt="E-Wallet Logo">
        </div>
    </header>

    <form class="form" action="./resposive.html" method="get">
        <div class="card">
            <div class="card-top">
                <img class="imglogin" src="./img/user.png" alt="Usuário">
                <h2>Login</h2>
                <p>Gerencie sua carteira</p>
            </div>

            <div class="card-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            </div>
            <div class="card-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="card-group2">
                <label>
                    <input type="checkbox" name="lembrar"> Lembre-me
                </label>
            </div>
            <div class="card-group btn">
                <button type="submit">Acessar</button>
            </div>
            <div class="cadastro">
                <p>Ainda não tem uma conta?</p>
                <a href="./cadastro.html">Cadastre-se</a>
            </div>
        </div>
    </form>

    <script src="./js/login.js"></script>
</body>
</html>
